<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">

<html>

<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1> Send your thoughts </h1>
    <div class="contact-us">
      <form action="https://formbold.com/s/3LjWk" method="post">
        <label for="customerName">Name (optional) <em>&#x2a;</em></label><input id="customerName" name="customerName" type="text" />
        <label for="customerEmail">Email (optional) <em>&#x2a;</em></label><input id="customerEmail" name="customerEmail" type="email" />
        <textarea id="customerNote" name="customerNote" required="" rows="4" placeholder="Your message..."></textarea>
        <button id="customerOrder">SUBMIT</button>
      </form>
    </div>
    
    <a href="https://prevwi.github.io/">
        <h1>Return to main page</h1>
        <img src="https://prevwi.github.io/assets/prevwi_github_QR.png"></>
    </a>

</body>

</html>
